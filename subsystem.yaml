# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-skill-forge
conformance_level: L3

base_url: http://localhost:3000
core_hub_url: https://csmju2030.jowave.com
core_hub_web_url: https://csmju2030.jowave.com
callback_path: /auth/callback

public_endpoints:
  - GET /api/v1/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

default_role_mapping:
  student: STUDENT
  alumni: ALUMNI
  staff: STAFF
  lecturer: LECTURER
  guest: GUEST
  admin: ADMIN

probes:
  collection: /api/v1/courses
  notFound: /api/v1/courses/99999999-9999-4999-8999-999999999999
  not_found: /api/v1/courses/99999999-9999-4999-8999-999999999999
  invalidId: /api/v1/courses/not-a-uuid
  invalid_id: /api/v1/courses/not-a-uuid
  create:
    path: /api/v1/courses
    allowedRole: staff
    allowed_role: staff
    deniedRole: guest
    denied_role: guest
    invalidBody:
      code: ""
      name_th: ""
      name_en: ""
      credits: -1
      category: invalid
    invalid_body:
      code: ""
      name_th: ""
      name_en: ""
      credits: -1
      category: invalid
    validBody:
      code: CONFORMANCE-ONLY
      name_th: Conformance only
      name_en: Conformance only
      credits: 1
      category: core
    valid_body:
      code: CONFORMANCE-ONLY
      name_th: Conformance only
      name_en: Conformance only
      credits: 1
      category: core

owners:
  pl: "@csmju2030/pl-skill-forge"
  aie: "@csmju2030/aie-skill-forge"

display_name: "SkillForge"
repo: github.com/CSMJU2030/csmju-skill-forge
status: proposed
